[env:m5stack-stamps3]
platform = espressif32@6.6.0
board = m5stack-stamps3
framework = arduino

lib_deps = 
    m5stack/M5Cardputer@^1.0.3
    h2zero/NimBLE-Arduino @ ^2.3.8
    https://github.com/HijelHub/HijelHID_BLEKeyboard.git
    
    
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
